name: Test Shopify Locations

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Get Shopify Locations
        env:
          SHOPIFY_STORE: ${{ secrets.SHOPIFY_STORE }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
        run: |
          python3 - <<'PY'
          import os
          import json
          import requests

          # Shopify API credentials
          store = os.environ["SHOPIFY_STORE"].strip()
          client_id = os.environ["SHOPIFY_CLIENT_ID"]
          client_secret = os.environ["SHOPIFY_CLIENT_SECRET"]

          print("Connecting to Shopify...")

          # Get Shopify Access Token
          response = requests.post(
              f"https://{store}/admin/oauth/access_token",
              data={
                  "grant_type": "client_credentials",
                  "client_id": client_id,
                  "client_secret": client_secret,
              },
              timeout=30,
          )

          response.raise_for_status()
          token = response.json()["access_token"]

          print("Shopify authentication successful!")

          # Get all Shopify locations
          query = """
          {
            locations(first: 100) {
              nodes {
                id
                name
                isActive
                fulfillsOnlineOrders
              }
            }
          }
          """

          result = requests.post(
              f"https://{store}/admin/api/2026-10/graphql.json",
              headers={
                  "X-Shopify-Access-Token": token,
                  "Content-Type": "application/json",
              },
              json={"query": query},
              timeout=30,
          )

          result.raise_for_status()

          data = result.json()

          if data.get("errors"):
              raise RuntimeError(json.dumps(data["errors"]))

          print("")
          print("================================")
          print("HIKOCO SHOPIFY LOCATIONS")
          print("================================")

          locations = data["data"]["locations"]["nodes"]

          for location in locations:
              print("")
              print("Location:", location["name"])
              print("Location ID:", location["id"])
              print("Active:", location["isActive"])
              print(
                  "Fulfils Online Orders:",
                  location["fulfillsOnlineOrders"]
              )
              print("--------------------------------")

          print("")
          print("Total Locations:", len(locations))
          print("Location check completed!")

          PY
